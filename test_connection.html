<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spicyreel – Supabase Connection Tester</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      background: #0d0a15;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 30px;
      max-width: 650px;
      width: 100%;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }
    h1 {
      margin-top: 0;
      font-size: 1.5rem;
      color: #ff2d55;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .info-box {
      background: rgba(0,0,0,0.4);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
      margin-bottom: 20px;
      word-break: break-all;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .btn {
      background: linear-gradient(135deg, #ff2d55, #ff7a00);
      border: none;
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      padding: 14px 28px;
      border-radius: 999px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 18px rgba(255,45,85,0.4);
      transition: all 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(255,45,85,0.6);
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    #consoleLog {
      background: #050409;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 16px;
      margin-top: 20px;
      font-family: monospace;
      font-size: 0.85rem;
      min-height: 180px;
      max-height: 350px;
      overflow-y: auto;
      white-space: pre-wrap;
      color: #00ff88;
    }
    .log-err { color: #ff4d6d; }
    .log-warn { color: #ffb703; }
    .log-info { color: #38bdf8; }
  </style>
</head>
<body>

  <div class="card">
    <h1>🌶️ Supabase API Connection Tester</h1>
    <div class="info-box">
      <strong>URL:</strong> https://fmyxdkllembfynbnqncw.supabase.co<br>
      <strong>Key:</strong> sb_publishable_PhKJez...
    </div>

    <button id="runBtn" class="btn" onclick="runDiagnostic()">Run Connection Test 🚀</button>

    <div id="consoleLog">Click 'Run Connection Test' to verify Supabase API...</div>
  </div>

  <script src="test_supabase.js"></script>
  <script>
    const logEl = document.getElementById('consoleLog');
    const runBtn = document.getElementById('runBtn');

    function appendLog(msg, type = '') {
      const cls = type ? ` class="log-${type}"` : '';
      logEl.innerHTML += `<div${cls}>${msg}</div>`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    async function runDiagnostic() {
      runBtn.disabled = true;
      runBtn.textContent = 'Running Tests... ⏳';
      logEl.innerHTML = '';

      const originalLog = console.log;
      const originalWarn = console.warn;
      const originalError = console.error;

      console.log = (...args) => {
        originalLog(...args);
        appendLog(args.map(a => typeof a === 'object' ? JSON.stringify(a, null, 2) : a).join(' '), 'info');
      };
      console.warn = (...args) => {
        originalWarn(...args);
        appendLog(args.map(a => typeof a === 'object' ? JSON.stringify(a, null, 2) : a).join(' '), 'warn');
      };
      console.error = (...args) => {
        originalError(...args);
        appendLog(args.map(a => typeof a === 'object' ? JSON.stringify(a, null, 2) : a).join(' '), 'err');
      };

      try {
        await window.testSupabaseConnection();
      } finally {
        console.log = originalLog;
        console.warn = originalWarn;
        console.error = originalError;
        runBtn.disabled = false;
        runBtn.textContent = 'Run Connection Test Again 🚀';
      }
    }
  </script>
</body>
</html>
